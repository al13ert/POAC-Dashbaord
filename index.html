<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POAC Dashboard</title>
    <style>
        /* Import Acre Font */
        @font-face {
            font-family: 'Acre';
            src: url('https://use.typekit.net/af/8e4df4/00000000000000007735ef28/30/l?primer=7cd0ba6e680145b028694a712c773419e9331899a0937a06016e788e001851e5&fvd=n4&v=3') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Acre', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #000; 
            color: #fff; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        
        /* Top Banner */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; background: #111; height: 60px; border-bottom: 1px solid #222; }
        .logo-title { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 18px; }
        .logo-title img { height: 32px; }
        .widget-info { display: flex; gap: 20px; align-items: center; font-size: 16px; }

        /* Main Content Grid */
        .content { display: grid; grid-template-columns: 2fr 1fr; gap: 15px; padding: 15px; flex: 1; height: calc(100vh - 100px); }
        .streams-container { display: flex; flex-direction: column; gap: 15px; height: 100%; }
        .stream-box { position: relative; width: 100%; flex: 1; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #222; }
        .stream-box iframe, .stream-box video { width: 100%; height: 100%; border: none; }

        /* Side Panel */
        .side-panel { background: #111; border-radius: 8px; border: 1px solid #222; overflow: hidden; display: flex; flex-direction: column; }
        .side-panel iframe { width: 100%; height: 100%; border: none; }

        /* Bottom Ticker */
        .ticker-bar { height: 40px; background: #111; border-top: 1px solid #222; display: flex; align-items: center; overflow: hidden; font-size: 14px; white-space: nowrap; }
        .ticker-content { display: inline-block; animation: marquee 30s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo-title">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
            <span>POAC DASHBOARD</span>
        </div>
        <div class="widget-info">
            <div id="weather">Hong Kong --°C</div>
            <div id="clock">00:00:00</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="content">
        <!-- Dual Live Streams -->
        <div class="streams-container">
            <!-- RTHK / Live Stream 1 -->
            <div class="stream-box">
                <iframe 
                    src="https://www.youtube.com/embed/live_stream?channel=UC__9e6aIid5a_7Q5O4C4D8g&autoplay=1&mute=1&cc_load_policy=1&cc_lang_pref=en" 
                    allow="autoplay; encrypted-media" 
                    allowfullscreen>
                </iframe>
            </div>
            <!-- DW News / Live Stream 2 -->
            <div class="stream-box">
                <iframe 
                    src="https://www.youtube.com/embed/v33fWdE3QYg?autoplay=1&mute=1&cc_load_policy=1&cc_lang_pref=en" 
                    allow="autoplay; encrypted-media" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- Notion / Side Tasks Panel -->
        <div class="side-panel">
            <iframe src="https://notion.so"></iframe>
        </div>
    </div>

    <!-- Live Market Ticker -->
    <div class="ticker-bar">
        <div class="ticker-content">
            <strong>HSI:</strong> -- | <strong>NASDAQ:</strong> -- | <strong>S&P 500:</strong> -- | <strong>BTC/USD:</strong> -- | <strong>ETH/USD:</strong> --
        </div>
    </div>

    <script>
        // Real-time Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
