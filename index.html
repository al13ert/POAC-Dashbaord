<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POAC Dashboard</title>
    <style>
        /* Rotating Fonts Definition */
        @font-face {
            font-family: 'Acre';
            src: url('https://use.typekit.net/af/8e4df4/00000000000000007735ef28/30/l?primer=7cd0ba6e680145b028694a712c773419e9331899a0937a06016e788e001851e5&fvd=n4&v=3') format('woff2');
            font-weight: normal; font-style: normal;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@400;700&family=Outfit:wght@500;700;800&family=Space+Grotesk:wght@500;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Acre', 'Outfit', 'Inter', -apple-system, sans-serif; 
            background: #080808; 
            color: #ffffff; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        
        /* Top Banner Header */
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 28px; 
            background: #111113; 
            height: 70px; 
            border-bottom: 2px solid #222226; 
        }
        
        .logo-title { 
            display: flex; 
            align-items: center; 
            gap: 14px; 
            font-weight: 800; 
            font-size: 24px; 
            letter-spacing: 1px;
        }
        
        .logo-title img { height: 38px; width: auto; }
        
        .widget-info { 
            display: flex; 
            gap: 28px; 
            align-items: center; 
            font-size: 20px; 
            font-weight: 600;
        }

        #clock {
            font-family: 'Roboto Mono', monospace;
            background: #1c1c20;
            padding: 6px 14px;
            border-radius: 6px;
            color: #00ffcc;
        }

        /* Main Dashboard Grid */
        .content { 
            display: grid; 
            grid-template-columns: 1.8fr 1.2fr; 
            gap: 16px; 
            padding: 16px; 
            flex: 1; 
            height: calc(100vh - 120px); 
        }

        /* Left Side: Dual Video Stream Container */
        .streams-container { 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            height: 100%; 
        }

        .stream-box { 
            position: relative; 
            width: 100%; 
            flex: 1; 
            background: #000; 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid #28282d; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .stream-box iframe { width: 100%; height: 100%; border: none; }

        /* Right Side: Notion Task Board Container */
        .side-panel { 
            background: #111113; 
            border-radius: 10px; 
            border: 1px solid #28282d; 
            overflow: hidden; 
            position: relative;
            height: 100%;
        }

        .side-panel iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }

        /* Bottom Stock & Market Ticker */
        .ticker-bar { 
            height: 50px; 
            background: #111113; 
            border-top: 2px solid #222226; 
            display: flex; 
            align-items: center; 
            overflow: hidden; 
            font-size: 18px; 
            white-space: nowrap; 
            font-weight: 600;
        }

        .ticker-content { 
            display: inline-block; 
            padding-left: 100%;
            animation: marquee 35s linear infinite; 
        }

        .ticker-item { margin-right: 35px; }
        .ticker-up { color: #00ff88; }
        .ticker-down { color: #ff3366; }

        @keyframes marquee { 
            0% { transform: translateX(0); } 
            100% { transform: translateX(-100%); } 
        }
    </style>
</head>
<body>

    <!-- Header Banner -->
    <div class="header">
        <div class="logo-title">
            <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
            <span id="dashboard-title">POAC DASHBOARD</span>
        </div>
        <div class="widget-info">
            <div id="weather">Hong Kong 26°C ☀️</div>
            <div id="clock">00:00:00</div>
        </div>
    </div>

    <!-- Main Workspace Grid -->
    <div class="content">
        <!-- Dual Live Broadcast Feeds -->
        <div class="streams-container">
            <!-- RTHK 32 Live Stream with Closed Captions -->
            <div class="stream-box">
                <iframe 
                    src="https://www.youtube.com/embed/live_stream?channel=UC__9e6aIid5a_7Q5O4C4D8g&autoplay=1&mute=1&cc_load_policy=1&cc_lang_pref=en" 
                    allow="autoplay; encrypted-media" 
                    allowfullscreen>
                </iframe>
            </div>
            <!-- DW News Live Stream with Closed Captions -->
            <div class="stream-box">
                <iframe 
                    src="https://www.youtube.com/embed/v33fWdE3QYg?autoplay=1&mute=1&cc_load_policy=1&cc_lang_pref=en" 
                    allow="autoplay; encrypted-media" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- Notion Embedded Workspace -->
        <div class="side-panel" id="notion-container">
            <iframe src="https://notion.so"></iframe>
        </div>
    </div>

    <!-- Multi-Source Market Ticker -->
    <div class="ticker-bar">
        <div class="ticker-content">
            <span class="ticker-item"><strong>HSI:</strong> 22,410.50 <span class="ticker-up">+1.2% ▲</span></span>
            <span class="ticker-item"><strong>NASDAQ:</strong> 18,120.30 <span class="ticker-up">+0.8% ▲</span></span>
            <span class="ticker-item"><strong>S&P 500:</strong> 5,750.10 <span class="ticker-up">+0.5% ▲</span></span>
            <span class="ticker-item"><strong>BTC/USD:</strong> $64,250.00 <span class="ticker-down">-0.4% ▼</span></span>
            <span class="ticker-item"><strong>ETH/USD:</strong> $2,640.15 <span class="ticker-up">+1.5% ▲</span></span>
        </div>
    </div>

    <script>
        // Real-Time Clock Function
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString();
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Rotating Daily Font System
        const fontRotation = ['Acre', 'Outfit', 'Space Grotesk', 'Inter'];
        const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
        const selectedFont = fontRotation[dayOfYear % fontRotation.length];
        document.body.style.fontFamily = `"${selectedFont}", -apple-system, sans-serif`;

        // Automated Scrolling Logic for Notion Board Container
        const notionContainer = document.getElementById('notion-container');
        let scrollDirection = 1;
        setInterval(() => {
            if (notionContainer) {
                notionContainer.scrollTop += scrollDirection;
                if (notionContainer.scrollTop + notionContainer.clientHeight >= notionContainer.scrollHeight || notionContainer.scrollTop === 0) {
                    scrollDirection *= -1;
                }
            }
        }, 50);
    </script>
</body>
</html>
