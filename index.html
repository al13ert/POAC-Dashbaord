<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Command Center | Institutional</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0c;
            --panel: #111114;
            --panel-2: #16161a;
            --border: #1e1e24;
            --text: #e8e8ed;
            --muted: #8b8b9a;
            --accent: #c9a227;
            --up: #3dd68c;
            --down: #f07178;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
            overflow: hidden;
        }

        .dashboard {
            display: grid;
            width: 100%;
            height: 100%;
            grid-template-rows: 48px 1fr 36px;
            gap: 8px;
            padding: 10px 14px;
            background: #000;
        }

        /* ===== TOP BAR ===== */
        .top-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0 16px;
        }

        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-wrap img {
            height: 32px;
            object-fit: contain;
            display: block;
        }

        .brand-text {
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text);
            display: none;
        }

        .banner-right {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .weather-pill {
            color: var(--text);
            font-weight: 500;
            max-width: 420px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #clock-display {
            background: var(--accent);
            color: #111;
            padding: 3px 10px;
            border-radius: 3px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* ===== MAIN AREA ===== */
        .main-area {
            display: grid;
            grid-template-rows: 1.6fr 1fr;
            gap: 8px;
            min-height: 0;
            transition: all 0.6s ease;
        }

        .streams-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            min-height: 0;
        }

        .tv-box {
            position: relative;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .tv-box video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        .stream-label {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 2px;
            z-index: 2;
            letter-spacing: 0.5px;
        }

        .cc-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 2px;
            z-index: 2;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.2s;
            user-select: none;
        }
        .cc-btn:hover {
            background: rgba(201,162,39,0.9);
            color: #111;
        }
        .cc-btn.active {
            background: var(--accent);
            color: #111;
            border-color: var(--accent);
        }
        .cc-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        video::cue {
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 1.1rem;
            line-height: 1.4;
            padding: 4px 8px;
        }

        /* ===== BOTTOM ===== */
        .bottom-row {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 8px;
            min-height: 0;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow: hidden;
        }

        .card-header {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border);
        }

        .rss-viewport {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .rss-track {
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: rssScroll 55s linear infinite;
        }

        @keyframes rssScroll {
            0%   { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }

        .news-item {
            background: var(--panel-2);
            padding: 7px 10px;
            border-radius: 3px;
            border-left: 2px solid var(--accent);
        }

        .news-title {
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-family: 'Inter', 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif;
        }

        .news-meta {
            font-size: 0.65rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .quote-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            gap: 10px;
            padding: 8px;
        }

        .quote-category {
            font-size: 0.68rem;
            color: var(--accent);
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .quote-text {
            font-size: 0.9rem;
            color: var(--text);
            line-height: 1.45;
            font-weight: 400;
            font-style: italic;
        }

        .quote-author {
            font-size: 0.72rem;
            color: var(--muted);
            font-weight: 500;
        }

        /* ===== TICKER ===== */
        .ticker-bar {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .ticker-label {
            background: var(--accent);
            color: #111;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0 12px;
            height: 100%;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
            flex-shrink: 0;
        }

        .ticker-track {
            flex: 1;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-content {
            display: inline-block;
            padding-left: 100%;
            animation: scroll 50s linear infinite;
            font-size: 0.82rem;
            font-weight: 500;
        }

        .ticker-content .item { margin-right: 36px; display: inline-block; }
        .ticker-content .up { color: var(--up); }
        .ticker-content .down { color: var(--down); }
        .ticker-content .name { color: var(--muted); margin-right: 4px; }
        .ticker-content .section {
            color: var(--accent);
            font-weight: 700;
            margin-right: 8px;
        }

        @keyframes scroll {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* ===== FOCUS MODES ===== */
        .main-area.focus-tv1 {
            grid-template-rows: 1fr;
        }
        .main-area.focus-tv1 .streams-row {
            grid-template-columns: 2.8fr 1fr;
        }
        .main-area.focus-tv1 .bottom-row {
            display: none;
        }

        .main-area.focus-tv2 {
            grid-template-rows: 1fr;
        }
        .main-area.focus-tv2 .streams-row {
            grid-template-columns: 1fr 2.8fr;
        }
        .main-area.focus-tv2 .bottom-row {
            display: none;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <!-- TOP -->
        <div class="top-banner">
            <div class="brand-wrap">
                <img src="logo.png" alt="Logo"
                     onerror="this.style.display='none'; document.getElementById('brand-fallback').style.display='inline';">
                <span id="brand-fallback" class="brand-text">COMMAND CENTER</span>
            </div>
            <div class="banner-right">
                <span class="weather-pill" id="weather-banner">--°C  Hong Kong</span>
                <span id="live-date">---</span>
                <span id="clock-display">00:00:00</span>
            </div>
        </div>

        <!-- MAIN -->
        <div class="main-area" id="main-area">
            <div class="streams-row">
                <div class="tv-box" id="tv-1-box">
                    <span class="stream-label">RTHK 32</span>
                    <div class="cc-btn" id="cc-btn-1" onclick="toggleSubtitles(1)">CC</div>
                    <video id="tv-1" autoplay muted playsinline></video>
                </div>
                <div class="tv-box" id="tv-2-box">
                    <span class="stream-label">CNA</span>
                    <div class="cc-btn" id="cc-btn-2" onclick="toggleSubtitles(2)">CC</div>
                    <video id="tv-2" autoplay muted playsinline></video>
                </div>
            </div>

            <div class="bottom-row">
                <!-- RSS -->
                <div class="card">
                    <div class="card-header">
                        <span>Market & World Briefing</span>
                        <span>LIVE</span>
                    </div>
                    <div class="rss-viewport">
                        <div class="rss-track" id="rss-track"></div>
                    </div>
                </div>

                <!-- QUOTE -->
                <div class="card">
                    <div class="card-header">Daily Focus</div>
                    <div class="quote-box">
                        <div class="quote-category" id="quote-cat">INSIGHT</div>
                        <div class="quote-text" id="quote-text">"Don't find customers for your products, find products for your customers."</div>
                        <div class="quote-author" id="quote-author">— Seth Godin</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- TICKER -->
        <div class="ticker-bar">
            <div class="ticker-label">MARKETS</div>
            <div class="ticker-track">
                <div class="ticker-content" id="ticker-content">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        const hlsInstances = {};
        const subtitleEnabled = { 1: false, 2: false };

        // CLOCK
        function updateClock() {
            const now = new Date();
            document.getElementById('clock-display').textContent =
                now.toLocaleTimeString('en-HK', { hour12: false });
            document.getElementById('live-date').textContent =
                now.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // WEATHER (Current + short-term outlook)
        function fetchWeather() {
            fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=en')
                .then(r => r.json())
                .then(d => {
                    if (d.temperature?.data?.[0]) {
                        const temp = d.temperature.data[0].value;
                        const hum = d.humidity?.data?.[0]?.value ? ` ${d.humidity.data[0].value}%` : '';

                        fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=flw&lang=en')
                            .then(r2 => r2.json())
                            .then(f => {
                                let outlook = '';
                                if (f.forecastDesc) {
                                    outlook = f.forecastDesc.split('.')[0] + '.';
                                    if (outlook.length > 55) outlook = outlook.substring(0, 52) + '...';
                                }
                                document.getElementById('weather-banner').textContent =
                                    `${temp}°C${hum}  ·  ${outlook || 'Hong Kong'}`;
                            })
                            .catch(() => {
                                document.getElementById('weather-banner').textContent = `${temp}°C${hum}  Hong Kong`;
                            });
                    }
                })
                .catch(() => {});
        }
        fetchWeather();
        setInterval(fetchWeather, 600000);

        // RSS (English + Hong Kong Traditional Chinese)
        async function fetchRSSNews() {
            const feeds = [
                { url: 'http://feeds.bbci.co.uk/news/world/rss.xml', src: 'WORLD' },
                { url: 'http://feeds.bbci.co.uk/sport/rss.xml', src: 'SPORT' },
                { url: 'https://rthk.hk/rthk/news/rss/c_expressnews_clocal.xml', src: '香港' },
                { url: 'https://rthk.hk/rthk/news/rss/c_expressnews_cinternational.xml', src: '國際' }
            ];

            let allItems = [];

            for (const feed of feeds) {
                try {
                    const res = await fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(feed.url));
                    const data = await res.json();
                    if (data.status === 'ok' && data.items) {
                        data.items.slice(0, 8).forEach(item => {
                            allItems.push({ title: item.title, src: feed.src });
                        });
                    }
                } catch(e) {}
            }

            allItems = allItems.sort(() => Math.random() - 0.5).slice(0, 20);

            const track = document.getElementById('rss-track');
            track.innerHTML = '';

            const createItems = () => {
                allItems.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'news-item';
                    div.innerHTML = `
                        <div class="news-title">${item.title}</div>
                        <div class="news-meta">${item.src}</div>
                    `;
                    track.appendChild(div);
                });
            };
            createItems();
            createItems();
        }
        fetchRSSNews();
        setInterval(fetchRSSNews, 180000);

        // QUOTES
        const inspirations = [
            { cat: "STRATEGY", text: "Prospecting is a muscle. The more you use it, the easier closing becomes.", author: "Sales Playbook" },
            { cat: "DISCIPLINE", text: "Quality is not an act, it is a habit.", author: "Aristotle" },
            { cat: "EXECUTION", text: "Consistency is what transforms average into excellence.", author: "Leadership" },
            { cat: "VALUE", text: "Value is created when problem severity meets solution precision.", author: "VINO Strategy" },
            { cat: "MINDSET", text: "The difference between winning and losing is most often not quitting.", author: "Walt Disney" },
            { cat: "INSIGHT", text: "Don't find customers for your products, find products for your customers.", author: "Seth Godin" }
        ];
        let inspireIdx = 0;
        function rotateInspiration() {
            inspireIdx = (inspireIdx + 1) % inspirations.length;
            const item = inspirations[inspireIdx];
            document.getElementById('quote-cat').textContent = item.cat;
            document.getElementById('quote-text').textContent = `"${item.text}"`;
            document.getElementById('quote-author').textContent = `— ${item.author}`;
        }
        setInterval(rotateInspiration, 12000);

        // MARKET TICKER
        const HK = [
            { s: '0700.HK', n: 'Tencent', fallback: '380.20', chg: '+1.42' },
            { s: '9988.HK', n: 'Alibaba', fallback: '82.50', chg: '+0.85' },
            { s: '0005.HK', n: 'HSBC', fallback: '68.10', chg: '-0.30' },
            { s: '1299.HK', n: 'AIA', fallback: '54.20', chg: '+1.10' }
        ];
        const JP = [
            { s: '7203.T', n: 'Toyota', fallback: '2810.0', chg: '+0.65' },
            { s: '6758.T', n: 'Sony', fallback: '13150.0', chg: '-0.20' },
            { s: '9984.T', n: 'SoftBank', fallback: '8820.0', chg: '+2.10' }
        ];
        const US = [
            { s: 'AAPL', n: 'Apple', fallback: '228.40', chg: '+0.52' },
            { s: 'NVDA', n: 'Nvidia', fallback: '121.80', chg: '+2.45' },
            { s: 'MSFT', n: 'Microsoft', fallback: '428.10', chg: '+0.18' }
        ];

        async function fetchYahoo(symbols) {
            const url = 'https://query1.finance.yahoo.com/v7/finance/quote?symbols=' + symbols.join(',');
            const proxies = [
                u => 'https://corsproxy.io/?' + encodeURIComponent(u),
                u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)
            ];
            for (const make of proxies) {
                try {
                    const r = await fetch(make(url));
                    if (!r.ok) continue;
                    const data = await r.json();
                    if (data.quoteResponse?.result) return data.quoteResponse.result;
                } catch(e) {}
            }
            return [];
        }

        async function updateTicker() {
            const allSym = [...HK, ...JP, ...US].map(x => x.s);
            const quotes = await fetchYahoo(allSym);
            const map = {};
            quotes.forEach(q => map[q.symbol] = q);

            let html = '';
            html += `<span class="item"><span class="section">HKEX</span></span>`;
            HK.forEach(s => {
                const q = map[s.s];
                const price = q?.regularMarketPrice ?? s.fallback;
                const chg = q?.regularMarketChangePercent ?? parseFloat(s.chg);
                const cls = chg >= 0 ? 'up' : 'down';
                const sign = chg >= 0 ? '+' : '';
                html += `<span class="item"><span class="name">${s.s.replace('.HK','')} ${s.n}</span> ${price} <span class="${cls}">${sign}${Number(chg).toFixed(2)}%</span></span>`;
            });
            html += `<span class="item"><span class="section">JAPAN</span></span>`;
            JP.forEach(s => {
                const q = map[s.s];
                const price = q?.regularMarketPrice ?? s.fallback;
                const chg = q?.regularMarketChangePercent ?? parseFloat(s.chg);
                const cls = chg >= 0 ? 'up' : 'down';
                const sign = chg >= 0 ? '+' : '';
                html += `<span class="item"><span class="name">${s.s.replace('.T','')} ${s.n}</span> ${price} <span class="${cls}">${sign}${Number(chg).toFixed(2)}%</span></span>`;
            });
            html += `<span class="item"><span class="section">US</span></span>`;
            US.forEach(s => {
                const q = map[s.s];
                const price = q?.regularMarketPrice ?? s.fallback;
                const chg = q?.regularMarketChangePercent ?? parseFloat(s.chg);
                const cls = chg >= 0 ? 'up' : 'down';
                const sign = chg >= 0 ? '+' : '';
                html += `<span class="item"><span class="name">${s.s} ${s.n}</span> ${price} <span class="${cls}">${sign}${Number(chg).toFixed(2)}%</span></span>`;
            });
            html += `<span class="item"><span class="section">FX</span></span>`;
            [{c:'USD/HKD',v:'7.8120'},{c:'EUR/HKD',v:'8.4850'},{c:'GBP/HKD',v:'10.120'},{c:'USD/JPY',v:'148.95'}].forEach(p => {
                html += `<span class="item"><span class="name">${p.c}</span> ${p.v}</span>`;
            });

            document.getElementById('ticker-content').innerHTML = html + html;
        }
        updateTicker();
        setInterval(updateTicker, 60000);

        // STREAMS + SUBTITLES
        function loadStream(id, url, btnId) {
            const el = document.getElementById(id);
            const btn = document.getElementById(btnId);
            if (!el) return;

            if (Hls.isSupported()) {
                const hls = new Hls({
                    manifestLoadingTimeOut: 15000,
                    enableWorker: true,
                    enableWebVTT: true,
                    enableIMSC1: true,
                    enableCEA708Captions: true
                });

                hls.loadSource(url);
                hls.attachMedia(el);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    el.muted = true;
                    el.play().catch(() => {});
                });

                hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, () => {
                    if (hls.subtitleTracks && hls.subtitleTracks.length > 0) {
                        btn.classList.remove('disabled');
                        btn.textContent = 'CC';
                        hls.subtitleTrack = -1;
                    } else {
                        btn.classList.add('disabled');
                        btn.textContent = 'No CC';
                    }
                });

                hlsInstances[id] = hls;
            } else if (el.canPlayType('application/vnd.apple.mpegurl')) {
                el.src = url;
                el.muted = true;
                el.play().catch(() => {});
                btn.classList.add('disabled');
                btn.textContent = 'No CC';
            }
        }

        function toggleSubtitles(num) {
            const videoId = `tv-${num}`;
            const btn = document.getElementById(`cc-btn-${num}`);
            const hls = hlsInstances[videoId];

            if (!hls || btn.classList.contains('disabled')) return;

            subtitleEnabled[num] = !subtitleEnabled[num];

            if (subtitleEnabled[num]) {
                if (hls.subtitleTracks.length > 0) {
                    hls.subtitleTrack = 0;
                    btn.classList.add('active');
                    btn.textContent = 'CC ON';
                }
            } else {
                hls.subtitleTrack = -1;
                btn.classList.remove('active');
                btn.textContent = 'CC';
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadStream('tv-1', 'https://rthktv32-live.akamaized.net/hls/live/2036819/RTHKTV32/master.m3u8', 'cc-btn-1');
            loadStream('tv-2', 'https://d2e1asnsl7br7b.cloudfront.net/7782e205e72f43aeb4a48ec97f66ebbe/index_5.m3u8', 'cc-btn-2');
        });

        // AUTO FOCUS CYCLE
        const mainArea = document.getElementById('main-area');

        function setFocusMode(mode) {
            mainArea.classList.remove('focus-tv1', 'focus-tv2');
            if (mode === 1) mainArea.classList.add('focus-tv1');
            if (mode === 2) mainArea.classList.add('focus-tv2');
        }

        let currentFocus = 0;
        setInterval(() => {
            currentFocus = (currentFocus + 1) % 3;
            if (currentFocus === 1) setFocusMode(1);
            else if (currentFocus === 2) setFocusMode(2);
            else setFocusMode(0);
        }, 180000);
    </script>
</body>
</html>
